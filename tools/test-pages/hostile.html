<!doctype html>
<meta charset="utf-8">
<title>hostile page (S6)</title>
<!--
  A page that behaves like a hostile website: it looks for the app's privileged binding and tries to reach the trusted shell.
  Served over http by tools/test-server.js. It reports what it saw in its own title, which the app logs as "[host] page title: [s6] {json}".
  Expected (every value is a pass): m0Type "undefined", m0Keys [], fetch/xhr "blocked", iframe "blocked".
-->
<body style="background:#400;color:#fff;font:24px sans-serif;margin:0;padding:20px">
<div id="out">hostile page running...</div>
<!-- a real click on this link (toolss6-hostile-page.ps1 sends one) navigates to the trusted shell's address: the app must refuse it -->
<a id="go" href="app://shell/index.html" style="position:absolute;left:20px;top:300px;color:#9cf;font-size:30px">open the shell</a>
<!-- positive control: the same kind of click on an ordinary link must work, or the check above proves nothing -->
<a id="ok" href="colours.html" style="position:absolute;left:20px;top:380px;color:#9cf;font-size:30px">an ordinary page</a>
<script>
(function () {
  var r = { m0Type: typeof window.m0, m0Keys: [], fetch: '?', xhr: '?', iframe: '?', topM0: typeof top.m0 };
  try { r.m0Keys = Object.getOwnPropertyNames(window).filter(function (k) { return /m0/i.test(k); }); } catch (e) { r.m0Keys = ['error ' + e.name]; }

  // every trusted page, not only the sidebar: the launcher and the widget panel are app://shell pages too (M2, M3)
  var targets = ['index.html', 'launcher.html', 'panel.html'];
  var pending = 3 * targets.length;
  var bad = { fetch: [], xhr: [], iframe: [] };
  function done() {
    if (--pending > 0) return;
    r.fetch = bad.fetch.length ? 'LEAK ' + bad.fetch.join(',') : 'blocked';
    r.xhr = bad.xhr.length ? 'LEAK ' + bad.xhr.join(',') : 'blocked';
    r.iframe = bad.iframe.length ? 'LEAK ' + bad.iframe.join(',') : 'blocked';
    document.title = '[s6] ' + JSON.stringify(r);
    document.getElementById('out').textContent = document.title;
  }
  targets.forEach(function (t) {
    var url = 'app://shell/' + t;
    // 1. fetch it: a different origin that sends no CORS permission, so this must fail
    fetch(url).then(function (resp) { bad.fetch.push(t + ' ' + resp.status); done(); }, function () { done(); });
    // 2. the same with XMLHttpRequest
    try {
      var x = new XMLHttpRequest();
      x.open('GET', url);
      x.onload = function () { bad.xhr.push(t + ' ' + x.status); done(); };
      x.onerror = function () { done(); };
      x.send();
    } catch (e) { done(); }
    // 3. frame it and try to read into it: it must not be readable from here
    var f = document.createElement('iframe');
    f.src = url;
    document.body.appendChild(f);
    setTimeout(function () {
      // Leak = the trusted page's own content (or its binding) is readable from here. An empty or error document is not a leak.
      try {
        var d = f.contentWindow.document, text = (d.body && d.body.innerText) || '';
        if (/Dev Browser|Ping|Searching|Pinned|Launcher/.test(text) || typeof f.contentWindow.m0 !== 'undefined') bad.iframe.push(t + ' ' + text.slice(0, 40));
      } catch (e) { /* not readable: good */ }
      done();
    }, 2500);
  });
})();
</script>
</body>
